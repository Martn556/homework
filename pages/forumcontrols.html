<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formcontrols</title>
</head>
<body>
    <h1>Регистрация</h1>
    <form action="registration">
        <p>Лични данни</p>
        Име: <input type="text" name="userName" placeholder="малко име, на латиница"> <br>
        Име: <input type="text" name="middleName" placeholder="фамилия, на латиница"> <br>
        Пол: Мъж:<input type="radio" name="gender" value="male"> Жена: <input type="radio" name="gender" value="female">
        <p>Коментар</p>
        <textarea name="comment" rows="4" cols="25" placeholder="напишете ни нещо"></textarea> <br>
        <button type="submit">Изпрати</button>
    </form>
</body>
</html>
